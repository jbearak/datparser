name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Tests and clippy in rust-tests
        working-directory: rust-tests
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
      # Again with tiny chunks and four threads, so small files take the
      # parallel paths.
      - name: Tests on the parallel paths
        working-directory: rust-tests
        run: cargo test
        env:
          DTA_TEST_SMALL_CHUNKS: "1"
          DTA_THREADS: "4"
      - name: Unit tests and clippy in src/rust
        working-directory: src/rust
        run: |
          cargo test --offline -p fixed-width
          cargo clippy --offline --all-targets -- -D warnings

  r:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::haven, any::jsonlite
      - run: R CMD build .
        shell: bash
      # Install from outside the checkout, as a user without the
      # repository would, with cargo offline and an empty cargo home, so
      # nothing can come from the network or a cache.
      - name: Install the source package offline
        shell: bash
        run: |
          home="$RUNNER_TEMP/cargo-home"
          mkdir -p "$home"
          cd "$RUNNER_TEMP"
          CARGO_NET_OFFLINE=true CARGO_HOME="$home" R CMD INSTALL "$GITHUB_WORKSPACE"/datparser_*.tar.gz
      - run: Rscript -e 'testthat::test_dir("tests/testthat", package = "datparser", load_package = "installed", stop_on_failure = TRUE)'
        shell: bash
      # Again with tiny chunks and four threads, so small files take the
      # parallel paths.
      - run: Rscript -e 'testthat::test_dir("tests/testthat", package = "datparser", load_package = "installed", stop_on_failure = TRUE)'
        shell: bash
        env:
          DTA_TEST_SMALL_CHUNKS: "1"
          DTA_THREADS: "4"
